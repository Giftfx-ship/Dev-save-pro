<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevSave Pro — Coming Soon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #111122;
      --bg-card: rgba(255, 255, 255, 0.04);
      --border-glass: rgba(255, 255, 255, 0.06);
      --text-primary: #ffffff;
      --text-secondary: #b0b0d0;
      --text-muted: #606080;
      --accent: #00ff88;
      --accent2: #6c5ce7;
      --accent3: #00d4ff;
      --shadow: 0 8px 48px rgba(0, 0, 0, 0.8);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }

    [data-theme="light"] {
      --bg-primary: #f0f2f8;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.8);
      --border-glass: rgba(0, 0, 0, 0.04);
      --text-primary: #0a0a1a;
      --text-secondary: #4a4a6a;
      --text-muted: #8888aa;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ===== ANIMATED BACKGROUND ORBS ===== */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 20s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: var(--accent);
      top: -150px;
      left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--accent2);
      bottom: -100px;
      right: -50px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: var(--accent3);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
      opacity: 0.06;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -40px) scale(1.2); }
    }

    /* ===== THEME TOGGLE ===== */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .theme-toggle:hover {
      transform: rotate(90deg) scale(1.1);
      border-color: var(--accent);
    }

    /* ===== MAIN CONTAINER ===== */
    .soon-container {
      position: relative;
      z-index: 1;
      max-width: 650px;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 4rem 2.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      transition: var(--transition);
    }

    /* ===== LOGO ===== */
    .logo-icon {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 0.8rem;
      animation: bounceBall 2s infinite ease-in-out;
      filter: drop-shadow(0 0 40px rgba(0, 255, 136, 0.25));
    }

    @keyframes bounceBall {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1.5px;
      margin-bottom: 0.2rem;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    /* ===== DIVIDER ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-glass), transparent);
    }

    /* ===== HEADLINE ===== */
    .headline {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 1.2rem;
      line-height: 1.3;
    }

    .headline .highlight {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== SOCIALS ===== */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .social-row a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      transition: var(--transition);
      text-decoration: none;
    }

    .social-row a:hover {
      transform: translateY(-6px) scale(1.1);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 10px 35px rgba(0, 255, 136, 0.12);
    }

    .social-row a.facebook:hover { color: #1877f2; border-color: #1877f2; box-shadow: 0 10px 35px rgba(24, 119, 242, 0.15); }
    .social-row a.whatsapp:hover { color: #25d366; border-color: #25d366; box-shadow: 0 10px 35px rgba(37, 211, 102, 0.15); }
    .social-row a.email:hover { color: #ea4335; border-color: #ea4335; box-shadow: 0 10px 35px rgba(234, 67, 53, 0.15); }
    .social-row a.twitter:hover { color: #1da1f2; border-color: #1da1f2; box-shadow: 0 10px 35px rgba(29, 161, 242, 0.15); }
    .social-row a.instagram:hover { color: #e4405f; border-color: #e4405f; box-shadow: 0 10px 35px rgba(228, 64, 95, 0.15); }

    /* ===== FOOTER ===== */
    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.65rem;
      color: var(--text-muted);
      opacity: 0.45;
      line-height: 1.8;
    }

    .footer-note a {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
      font-weight: 600;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .soon-container {
        padding: 3rem 1.5rem;
      }
      .brand-title {
        font-size: 2rem;
      }
      .headline {
        font-size: 1.3rem;
      }
      .logo-icon {
        font-size: 3.5rem;
      }
      .theme-toggle {
        top: 15px;
        right: 15px;
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .soon-container {
        padding: 2.5rem 1.2rem;
        border-radius: 12px;
      }
      .brand-title {
        font-size: 1.6rem;
      }
      .brand-sub {
        font-size: 0.6rem;
        letter-spacing: 3px;
      }
      .headline {
        font-size: 1.1rem;
      }
      .logo-icon {
        font-size: 3rem;
      }
      .social-row a {
        width: 42px;
        height: 42px;
        font-size: 1rem;
      }
      .divider {
        font-size: 0.55rem;
        letter-spacing: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== BACKGROUND ORBS ===== -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ===== THEME TOGGLE ===== -->
  <button class="theme-toggle" id="themeToggle">
    <i class="fas fa-moon"></i>
  </button>

  <!-- ===== COMING SOON CARD ===== -->
  <div class="soon-container">

    <span class="logo-icon">⚽</span>
    <h1 class="brand-title">DevSave Pro</h1>
    <p class="brand-sub">Live Football Streaming</p>

    <div class="divider">Coming Soon</div>

    <h2 class="headline">
      Something <span class="highlight">big</span> is kicking off
    </h2>

    <!-- ===== SOCIALS ===== -->
    <div class="social-row">
      <a href="https://www.facebook.com/profile.php?id=100083300451857" target="_blank" class="facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="https://wa.me/2349164624021" target="_blank" class="whatsapp" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="mailto:devvgift@gmail.com" class="email" title="Email"><i class="fas fa-envelope"></i></a>
      
    </div>

    <div class="footer-note">
      © 2025 <a href="#">DevSave Pro</a> — Developed with ❤️ by <a href="https://www.facebook.com/profile.php?id=100083300451857" target="_blank">Dev Gift</a>
    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    // ===== THEME =====
    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');

    function getTheme() {
      return localStorage.getItem('theme') || 'dark';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }

    themeToggle.addEventListener('click', () => {
      const current = getTheme();
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    setTheme(getTheme());

    console.log('%c⚽ DevSave Pro — Coming Soon', 'font-size:24px; font-weight:bold; color:#00ff88;');
    console.log('%c💻 Built with ❤️ by Dev Gift', 'font-size:14px; color:#a0a0c0;');
  </script>

</body>
</html>
