<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSave Pro - Live Football Streaming</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #111122;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #b0b0d0;
            --text-muted: #606080;
            --accent: #00ff88;
            --accent2: #6c5ce7;
            --accent3: #00d4ff;
            --accent4: #ff6b9d;
            --shadow: 0 8px 48px rgba(0, 0, 0, 0.8);
            --radius: 12px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            --glow: 0 0 60px rgba(0, 255, 136, 0.04);
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f8;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --border-glass: rgba(0, 0, 0, 0.04);
            --text-primary: #0a0a1a;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            --glow: 0 0 40px rgba(0, 255, 136, 0.02);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
            opacity: 0;
            animation: bodyFadeIn 0.8s ease forwards;
        }

        @keyframes bodyFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== LOADING ===== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-right-color: var(--accent2);
            border-bottom-color: var(--accent3);
            animation: spinLoader 1.4s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.1);
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
            animation: pulseText 1.5s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .loader-text span {
            color: var(--accent);
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .loader-progress {
            margin-top: 1.5rem;
            width: 200px;
            height: 2px;
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            border-radius: 10px;
            animation: progressLoad 2s ease-in-out forwards;
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* ===== BACKGROUND ===== */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(108, 92, 231, 0.02) 0%, transparent 60%),
                        var(--bg-primary);
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== GLASS ===== */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            box-shadow: var(--shadow), var(--glow);
            transition: var(--transition);
        }

        .glass:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 60px rgba(0, 255, 136, 0.06), var(--glow);
            border-color: rgba(0, 255, 136, 0.08);
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 0.8rem 2.5rem;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease infinite;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: var(--accent);
            animation: rotate 12s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            transform: translateX(-5px);
            border-color: transparent;
            box-shadow: 0 4px 30px rgba(0, 255, 136, 0.2);
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .theme-toggle:hover {
            transform: rotate(90deg) scale(1.1);
            border-color: var(--accent);
        }

        .version-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            animation: pulseBadge 2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            padding: 100px 2.5rem 4rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .page-header .icon {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            display: block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .page-header h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .page-header .live-badge {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.3rem 1.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255, 0, 0, 0.12);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.15);
            animation: liveBadgePulse 2s infinite;
        }

        @keyframes liveBadgePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }

        .page-header .live-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            margin-right: 8px;
            animation: dotPulse 1.2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.6); }
        }

        /* ===== MATCH CARDS ===== */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .match-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            opacity: 0;
            transition: var(--transition);
        }

        .match-card:hover::before {
            opacity: 1;
        }

        .match-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 255, 136, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), var(--glow);
        }

        .match-card .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .match-card .match-teams {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .match-card .team {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .match-card .team .team-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: contain;
            background: var(--bg-card);
            padding: 6px;
            border: 2px solid var(--border-glass);
            transition: var(--transition);
        }

        .match-card .team .team-logo:hover {
            transform: scale(1.15) rotate(-8deg);
            border-color: var(--accent2);
        }

        .match-card .team .team-info {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .match-card .team .team-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .match-card .vs-badge {
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            letter-spacing: 2px;
        }

        .match-card .match-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .match-card .status-badge {
            padding: 0.25rem 1rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-card .status-badge.live {
            background: rgba(255, 0, 0, 0.12);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.15);
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.98); }
        }

        .match-card .status-badge.final {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.08);
        }

        .match-card .status-badge.scheduled {
            background: rgba(0, 212, 255, 0.06);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.08);
        }

        .match-card .league-name {
            font-size: 0.6rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0.15rem 0.7rem;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            font-weight: 600;
        }

        .match-card .match-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-card);
            padding: 0.15rem 0.7rem;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
        }

        .match-card .match-time i {
            font-size: 0.5rem;
            color: var(--accent2);
        }

        .match-card .match-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-glass);
            margin-top: 1rem;
        }

        .watch-btn {
            padding: 0.6rem 2rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 30px rgba(0, 255, 136, 0.15);
            position: relative;
            overflow: hidden;
        }

        .watch-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent2), var(--accent3));
            opacity: 0;
            transition: var(--transition);
        }

        .watch-btn:hover::before {
            opacity: 1;
        }

        .watch-btn i,
        .watch-btn span {
            position: relative;
            z-index: 1;
        }

        .watch-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 40px rgba(0, 255, 136, 0.3);
        }

        .watch-btn.live-btn {
            background: linear-gradient(135deg, #ff4444, #ff00ff);
            animation: btnPulse 2s infinite;
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 4px 30px rgba(255, 0, 255, 0.15); }
            50% { box-shadow: 0 8px 50px rgba(255, 0, 255, 0.35); }
        }

        .match-card .stream-count {
            font-size: 0.55rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .no-matches {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .no-matches i {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
            color: var(--text-muted);
        }

        .matches-loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .matches-loading .spinner {
            animation: spin 1s linear infinite;
            font-size: 2.5rem;
            color: var(--accent2);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== WHATSAPP FLOATING ===== */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 8px 40px rgba(37, 211, 102, 0.3);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            animation: whatsappPulse 2s ease-in-out infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 12px 50px rgba(37, 211, 102, 0.4);
        }

        @keyframes whatsappPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 40px rgba(37, 211, 102, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 12px 50px rgba(37, 211, 102, 0.4); }
        }

        .whatsapp-float .tooltip {
            position: absolute;
            right: 75px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(15px) scale(0.95);
            transition: var(--transition);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            font-weight: 600;
        }

        .whatsapp-float:hover .tooltip {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        /* ===== FOOTER ===== */
        .footer {
            position: relative;
            z-index: 1;
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            border-top: 1px solid var(--border-glass);
            margin-top: 4rem;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-socials a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            transition: var(--transition);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .footer-socials a::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            opacity: 0;
            transition: var(--transition);
        }

        .footer-socials a:hover::before {
            opacity: 0.12;
        }

        .footer-socials a:hover {
            transform: translateY(-5px) scale(1.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .footer-socials a.facebook:hover { color: #1877f2; border-color: #1877f2; }
        .footer-socials a.instagram:hover { color: #e4405f; border-color: #e4405f; }
        .footer-socials a.twitter:hover { color: #1da1f2; border-color: #1da1f2; }
        .footer-socials a.whatsapp:hover { color: #25d366; border-color: #25d366; }
        .footer-socials a.telegram:hover { color: #0088cc; border-color: #0088cc; }
        .footer-socials a.github:hover { color: #6e5494; border-color: #6e5494; }
        .footer-socials a.email:hover { color: #ea4335; border-color: #ea4335; }

        .footer-socials a i {
            position: relative;
            z-index: 1;
        }

        .footer p {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .footer p a {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            font-weight: 600;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 0.8rem 1.8rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            z-index: 99999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #00ff88; }
        .toast.success i { color: #00ff88; }
        .toast.error { border-color: #ff4444; }
        .toast.error i { color: #ff4444; }
        .toast.info { border-color: var(--accent2); }
        .toast.info i { color: var(--accent2); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .container { padding: 90px 1.5rem 3rem; }
            .match-card .match-teams { gap: 1rem; }
            .match-card .team { gap: 0.6rem; }
            .match-card .team .team-logo { width: 40px; height: 40px; }
        }

        @media (max-width: 768px) {
            .container { padding: 80px 1rem 2rem; }
            .page-header h1 { font-size: 2rem; }
            .match-card { padding: 1.2rem 1.2rem; }
            .match-card .match-teams { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            .match-card .team { justify-content: space-between; }
            .match-card .team .team-logo { width: 35px; height: 35px; }
            .match-card .team .team-name { font-size: 0.85rem; }
            .match-card .match-top { flex-direction: column; align-items: stretch; }
            .match-card .match-meta { justify-content: flex-start; }
            .match-card .match-bottom { flex-direction: column; align-items: stretch; }
            .watch-btn { justify-content: center; }
            .navbar { padding: 0.6rem 1rem; }
            .logo { font-size: 1.3rem; }
            .back-btn span { display: none; }
            .whatsapp-float { width: 50px; height: 50px; font-size: 1.6rem; bottom: 20px; right: 20px; }
            .whatsapp-float .tooltip { display: none; }
        }

        @media (max-width: 480px) {
            .page-header h1 { font-size: 1.5rem; }
            .match-card .team .team-logo { width: 28px; height: 28px; padding: 3px; }
            .match-card .team .team-name { font-size: 0.7rem; }
            .match-card .match-meta { gap: 0.4rem; }
            .watch-btn { padding: 0.4rem 1.2rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING ===== -->
    <div id="loadingOverlay">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading <span>DevSave Pro</span></div>
        <div class="loader-progress">
            <div class="loader-progress-bar"></div>
        </div>
    </div>

    <!-- ===== BACKGROUND ===== -->
    <div class="gradient-bg"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="#" class="logo">
            <i class="fas fa-bolt"></i>
            DevSave Pro
        </a>
        <div class="nav-actions">
            <a href="#" class="back-btn" onclick="location.reload()">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <span class="version-badge">v3.0</span>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <div class="page-header">
            <i class="fas fa-futbol icon"></i>
            <h1>Live Football Streaming</h1>
            <p>Watch live matches from leagues around the world</p>
            <div class="live-badge">
                <span class="dot"></span> Live Now
            </div>
        </div>

        <!-- ===== MATCHES ===== -->
        <div id="matchesContainer">
            <div class="matches-loading" id="matchesLoading">
                <div class="spinner"><i class="fas fa-spinner"></i></div>
                <p style="margin-top:1.5rem; font-weight:600;">Loading matches...</p>
            </div>
            <div class="matches-grid" id="matchesGrid"></div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-socials">
            <a href="https://www.facebook.com/profile.php?id=100083300451857" target="_blank" class="facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://wa.me/2349164624021" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="mailto:devvgift@gmail.com" class="email"><i class="fas fa-envelope"></i></a>
            <a href="#" class="twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" class="instagram"><i class="fab fa-instagram"></i></a>
        </div>
        <p>
            © 2025 <a href="#">DevSave Pro</a> — Developed with ❤️ by
            <a href="https://www.facebook.com/profile.php?id=100083300451857" target="_blank">Dev Gift</a>
        </p>
    </footer>

    <!-- ===== WHATSAPP ===== -->
    <a href="https://wa.me/2349164624021" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
        <span class="tooltip">Chat with us 💬</span>
    </a>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== LOADING =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1500);
        });

        // ===== PARTICLES =====
        (function particles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            const particleCount = 50;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2;
                    this.radius = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.2 + 0.05;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    const accent = getComputedStyle(document.documentElement)
                        .getPropertyValue('--accent').trim() || '#00ff88';
                    ctx.fillStyle = accent.replace(')', `, ${this.opacity})`).replace('rgb', 'rgba');
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function drawLines() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            const opacity = (1 - dist / 150) * 0.03;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            const accent = getComputedStyle(document.documentElement)
                                .getPropertyValue('--accent').trim() || '#00ff88';
                            ctx.strokeStyle = accent.replace(')', `, ${opacity})`).replace('rgb', 'rgba');
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update();
                    p.draw(); });
                drawLines();
                requestAnimationFrame(animateParticles);
            }

            resize();
            initParticles();
            animateParticles();

            window.addEventListener('resize', () => {
                resize();
                initParticles();
            });
        })();

        // ===== THEME =====
        const themeToggle = document.getElementById('themeToggle');
        const icon = themeToggle.querySelector('i');

        function getTheme() {
            return localStorage.getItem('theme') || 'dark';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        themeToggle.addEventListener('click', () => {
            const current = getTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        setTheme(getTheme());

        // ===== API CONFIG =====
        const API_KEY = 'RF-KEY-FC7852539D3F';
        const API_BASE = 'https://api.runflix.name.ng/api';

        let allMatches = [];

        // ===== FETCH MATCHES =====
        async function fetchMatches() {
            const grid = document.getElementById('matchesGrid');
            const loading = document.getElementById('matchesLoading');

            try {
                // Try football streaming endpoint
                let response = await fetch(`${API_BASE}/football/streaming?apikey=${API_KEY}`);
                
                if (!response.ok) {
                    // Try sports all endpoint
                    response = await fetch(`${API_BASE}/sports/all?category=football&apikey=${API_KEY}`);
                }

                if (!response.ok) {
                    throw new Error('Failed to fetch matches');
                }

                const data = await response.json();
                console.log('API Response:', data);

                let matches = [];

                // Parse different response formats
                if (data.result && data.result.matches) {
                    matches = data.result.matches;
                } else if (data.result && Array.isArray(data.result)) {
                    matches = data.result;
                } else if (data.matches) {
                    matches = data.matches;
                } else if (Array.isArray(data)) {
                    matches = data;
                }

                if (matches.length === 0) {
                    grid.innerHTML = `
                        <div class="no-matches">
                            <i class="fas fa-futbol"></i>
                            <p>No matches available right now</p>
                            <p style="font-size:0.8rem;margin-top:0.5rem;opacity:0.5;">Check back later for live games</p>
                        </div>
                    `;
                    loading.style.display = 'none';
                    return;
                }

                allMatches = matches;
                renderMatches(matches);

            } catch (error) {
                console.error('Error fetching matches:', error);
                grid.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading matches. Please try again.</p>
                        <button onclick="fetchMatches()" style="margin-top:1rem;padding:0.5rem 2rem;border-radius:50px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:700;cursor:pointer;font-family:inherit;">
                            <i class="fas fa-sync"></i> Retry
                        </button>
                    </div>
                `;
            }

            loading.style.display = 'none';
        }

        // ===== RENDER MATCHES =====
        function renderMatches(matches) {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = '';

            // Sort: Live matches first
            matches.sort((a, b) => {
                const aLive = isLiveMatch(a);
                const bLive = isLiveMatch(b);
                if (aLive && !bLive) return -1;
                if (!aLive && bLive) return 1;
                return 0;
            });

            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';

                const homeTeam = match.homeTeam || match.home || match.teams?.home?.name || 'Home';
                const awayTeam = match.awayTeam || match.away || match.teams?.away?.name || 'Away';
                const homeLogo = match.homeLogo || match.homeBadge || match.teams?.home?.logo || '';
                const awayLogo = match.awayLogo || match.awayBadge || match.teams?.away?.logo || '';
                const league = match.league || match.leagueName || 'Football';
                const status = match.status || 'Scheduled';
                const date = match.date || match.startTime || match.startTime || '';
                const sources = match.sources || match.streams || [];

                const isLive = isLiveMatch(match);
                const isFinal = status === 'Full Time' || status === 'FT' || status === 'Finished';

                let statusClass = 'scheduled';
                let statusText = status || 'Scheduled';
                let btnClass = '';
                let btnText = 'Watch Now';

                if (isLive) {
                    statusClass = 'live';
                    statusText = '🔴 LIVE';
                    btnClass = 'live-btn';
                    btnText = '▶ Watch Live';
                } else if (isFinal) {
                    statusClass = 'final';
                    statusText = '✅ Full Time';
                    btnText = '📹 Watch Replay';
                }

                const streamCount = sources.length || 0;

                card.innerHTML = `
                    <div class="match-top">
                        <div class="match-teams">
                            <div class="team">
                                <img class="team-logo" src="${homeLogo || 'https://via.placeholder.com/50/00ff88/ffffff?text=?'}" alt="${homeTeam}" onerror="this.src='https://via.placeholder.com/50/00ff88/ffffff?text=?'" />
                                <div class="team-info">
                                    <span class="team-name">${homeTeam}</span>
                                </div>
                            </div>
                            <span class="vs-badge">VS</span>
                            <div class="team">
                                <img class="team-logo" src="${awayLogo || 'https://via.placeholder.com/50/00ff88/ffffff?text=?'}" alt="${awayTeam}" onerror="this.src='https://via.placeholder.com/50/00ff88/ffffff?text=?'" />
                                <div class="team-info">
                                    <span class="team-name">${awayTeam}</span>
                                </div>
                            </div>
                        </div>
                        <div class="match-meta">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <span class="league-name">${league}</span>
                            <span class="match-time">
                                <i class="far fa-clock"></i> ${formatDate(date)}
                            </span>
                        </div>
                    </div>
                    <div class="match-bottom">
                        <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;width:100%;">
                            <button class="watch-btn ${btnClass}" onclick="watchMatch('${match.id || match._id || ''}', '${homeTeam}', '${awayTeam}')">
                                <i class="fas fa-play"></i>
                                <span>${btnText}</span>
                            </button>
                            <span class="stream-count">${streamCount} streams available</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // ===== CHECK IF LIVE =====
        function isLiveMatch(match) {
            const status = match.status || '';
            const liveStatuses = ['Live', '1H', '2H', 'HT', 'ET', 'P', 'In Progress', 'Half Time', 'Second Half', 'First Half'];
            return liveStatuses.some(s => status.includes(s));
        }

        // ===== FORMAT DATE =====
        function formatDate(dateString) {
            if (!dateString) return 'TBD';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateString;
            }
        }

        // ===== WATCH MATCH =====
        function watchMatch(matchId, homeTeam, awayTeam) {
            // Search for streams
            const match = allMatches.find(m => (m.id || m._id) === matchId);
            let streamUrl = '';

            if (match && match.sources && match.sources.length > 0) {
                const source = match.sources[0];
                streamUrl = source.url || source.originalUrl || '';
            }

            if (!streamUrl) {
                // Fallback: Search Google
                streamUrl = `https://www.google.com/search?q=${encodeURIComponent(homeTeam + ' vs ' + awayTeam + ' live stream')}`;
            }

            // Open in new tab
            window.open(streamUrl, '_blank');
            
            showToast(`Opening ${homeTeam} vs ${awayTeam}...`, 'info');
        }

        // ===== SHOW TOAST =====
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconMap = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // ===== INIT =====
        fetchMatches();

        // Refresh every 60 seconds
        setInterval(fetchMatches, 60000);

        console.log('%c⚽ DevSave Pro - World-Class Football Streaming', 'font-size:24px; font-weight:bold; color:#00ff88;');
        console.log('%c💻 Built with ❤️ by Dev Gift', 'font-size:14px; color:#a0a0c0;');
        console.log('%c🏆 Live Football from RunFlix API', 'font-size:12px; color:#00d4ff;');
    </script>
