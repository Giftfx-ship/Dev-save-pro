<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSave Pro - Live Football</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #111122;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #b0b0d0;
            --text-muted: #606080;
            --accent: #00ff88;
            --accent2: #6c5ce7;
            --accent3: #00d4ff;
            --shadow: 0 8px 48px rgba(0, 0, 0, 0.8);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f8;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --border-glass: rgba(0, 0, 0, 0.04);
            --text-primary: #0a0a1a;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
            padding-bottom: 80px;
        }

        /* ===== LOADING ===== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-right-color: var(--accent2);
            border-bottom-color: var(--accent3);
            animation: spinLoader 1.4s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 2rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
            animation: pulseText 1.5s ease-in-out infinite;
        }

        .loader-text span {
            color: var(--accent);
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .loader-progress {
            margin-top: 1.5rem;
            width: 200px;
            height: 2px;
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            border-radius: 10px;
            animation: progressLoad 2s ease-in-out forwards;
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 0.7rem 1.5rem;
            background: rgba(10, 10, 18, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border-color: transparent;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            transform: rotate(90deg) scale(1.1);
            border-color: var(--accent);
        }

        .version-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 50px;
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 1rem 2rem;
        }

        /* ===== HEADER ===== */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .page-header .live-badge {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.2rem 1.2rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(255, 0, 0, 0.12);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.15);
            animation: liveBadgePulse 2s infinite;
        }

        @keyframes liveBadgePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }

        .page-header .live-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            margin-right: 6px;
            animation: dotPulse 1.2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.6); }
        }

        /* ===== DATE TABS ===== */
        .date-tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            scrollbar-width: none;
        }

        .date-tabs::-webkit-scrollbar {
            display: none;
        }

        .date-tab {
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .date-tab:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .date-tab.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.15);
        }

        .date-tab .count {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.02rem 0.4rem;
            border-radius: 50px;
            font-size: 0.45rem;
            margin-left: 0.3rem;
        }

        /* ===== MATCH CARD ===== */
        .match-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            margin-bottom: 0.8rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            opacity: 0;
            transition: var(--transition);
        }

        .match-card:hover::before {
            opacity: 1;
        }

        .match-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 255, 136, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .match-card .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .match-card .match-teams {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .match-card .team {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .match-card .team .team-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: contain;
            background: var(--bg-card);
            padding: 4px;
            border: 1px solid var(--border-glass);
            transition: var(--transition);
        }

        .match-card .team .team-logo:hover {
            transform: scale(1.1);
            border-color: var(--accent2);
        }

        .match-card .team .team-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .match-card .vs-badge {
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.6rem;
            padding: 0.15rem 0.5rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            letter-spacing: 1.5px;
        }

        .match-card .match-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .match-card .status-badge {
            padding: 0.15rem 0.8rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .match-card .status-badge.live {
            background: rgba(255, 0, 0, 0.12);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.15);
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .match-card .status-badge.final {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.08);
        }

        .match-card .status-badge.scheduled {
            background: rgba(0, 212, 255, 0.06);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.08);
        }

        .match-card .league-name {
            font-size: 0.55rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            font-weight: 600;
        }

        .match-card .match-time {
            font-size: 0.55rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-card);
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
        }

        /* ===== STREAM CHANNELS ===== */
        .match-card .stream-channels {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-glass);
        }

        .match-card .stream-channels .channel-label {
            font-size: 0.55rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            margin-right: 0.3rem;
        }

        .match-card .stream-channels .channel-btn {
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .match-card .stream-channels .channel-btn:hover {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.15);
        }

        .match-card .stream-channels .channel-btn i {
            margin-right: 0.2rem;
            font-size: 0.5rem;
        }

        /* ===== NO MATCHES ===== */
        .no-matches {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .no-matches i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        /* ===== WHATSAPP FLOATING ===== */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 55px;
            height: 55px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 8px 40px rgba(37, 211, 102, 0.3);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            animation: whatsappPulse 2s ease-in-out infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 50px rgba(37, 211, 102, 0.4);
        }

        @keyframes whatsappPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 40px rgba(37, 211, 102, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 12px 50px rgba(37, 211, 102, 0.4); }
        }

        .whatsapp-float .tooltip {
            position: absolute;
            right: 70px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-size: 0.65rem;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(15px) scale(0.95);
            transition: var(--transition);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            font-weight: 600;
        }

        .whatsapp-float:hover .tooltip {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 2rem 1rem 1rem;
            border-top: 1px solid var(--border-glass);
            margin-top: 3rem;
            background: var(--bg-card);
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .footer-socials a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            transition: var(--transition);
            text-decoration: none;
        }

        .footer-socials a:hover {
            transform: translateY(-4px) scale(1.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .footer-socials a.facebook:hover { color: #1877f2; border-color: #1877f2; }
        .footer-socials a.whatsapp:hover { color: #25d366; border-color: #25d366; }
        .footer-socials a.email:hover { color: #ea4335; border-color: #ea4335; }
        .footer-socials a.twitter:hover { color: #1da1f2; border-color: #1da1f2; }
        .footer-socials a.instagram:hover { color: #e4405f; border-color: #e4405f; }

        .footer p {
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .footer p a {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            font-weight: 600;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 0.6rem 1.5rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            z-index: 99999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #00ff88; }
        .toast.success i { color: #00ff88; }
        .toast.error { border-color: #ff4444; }
        .toast.error i { color: #ff4444; }
        .toast.info { border-color: var(--accent2); }
        .toast.info i { color: var(--accent2); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container { padding: 70px 0.8rem 2rem; }
            .match-card { padding: 1rem 1.2rem; }
            .match-card .match-teams { gap: 0.8rem; }
            .match-card .team { gap: 0.5rem; }
            .match-card .team .team-logo { width: 32px; height: 32px; padding: 3px; }
            .match-card .team .team-name { font-size: 0.75rem; }
            .match-card .vs-badge { font-size: 0.5rem; padding: 0.1rem 0.4rem; }
            .match-card .match-top { flex-direction: column; align-items: stretch; }
            .match-card .match-meta { justify-content: flex-start; }
            .match-card .stream-channels { justify-content: center; }
            .page-header h1 { font-size: 1.5rem; }
            .date-tab { padding: 0.3rem 0.8rem; font-size: 0.6rem; }
            .whatsapp-float { width: 50px; height: 50px; font-size: 1.5rem; bottom: 20px; right: 20px; }
            .whatsapp-float .tooltip { display: none; }
            .navbar { padding: 0.5rem 1rem; }
            .logo { font-size: 1.1rem; }
            .back-btn span { display: none; }
        }

        @media (max-width: 480px) {
            .match-card .team .team-logo { width: 28px; height: 28px; }
            .match-card .team .team-name { font-size: 0.65rem; }
            .match-card .stream-channels .channel-btn { padding: 0.15rem 0.6rem; font-size: 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING ===== -->
    <div id="loadingOverlay">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading <span>DevSave Pro</span></div>
        <div class="loader-progress">
            <div class="loader-progress-bar"></div>
        </div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="#" class="logo">
            <i class="fas fa-bolt"></i>
            DevSave Pro
        </a>
        <div class="nav-actions">
            <a href="#" class="back-btn" onclick="location.reload()">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <span class="version-badge">v3.0</span>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <div class="page-header">
            <h1>⚽ Live Football Streaming</h1>
            <p>Watch live matches from leagues around the world</p>
            <div class="live-badge">
                <span class="dot"></span> Live Now
            </div>
        </div>

        <!-- ===== DATE TABS ===== -->
        <div class="date-tabs" id="dateTabs">
            <button class="date-tab active" data-date="today">📅 Today <span class="count" id="todayCount">0</span></button>
            <button class="date-tab" data-date="tomorrow">📅 Tomorrow <span class="count" id="tomorrowCount">0</span></button>
            <button class="date-tab" data-date="upcoming">📅 Upcoming <span class="count" id="upcomingCount">0</span></button>
        </div>

        <!-- ===== MATCHES ===== -->
        <div id="matchesContainer">
            <div style="text-align:center;padding:3rem;color:var(--text-secondary);">
                <div style="animation:spin 1s linear infinite;font-size:2.5rem;color:var(--accent2);display:inline-block;">
                    <i class="fas fa-spinner"></i>
                </div>
                <p style="margin-top:1.5rem;font-weight:600;">Loading matches...</p>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-socials">

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== LOADING =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1500);
        });

        // ===== THEME =====
        const themeToggle = document.getElementById('themeToggle');
        const icon = themeToggle.querySelector('i');

        function getTheme() {
            return localStorage.getItem('theme') || 'dark';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        themeToggle.addEventListener('click', () => {
            const current = getTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        setTheme(getTheme());

        // ===== API CONFIG =====
        const API_KEY = 'RF-KEY-FC7852539D3F';
        const API_BASE = 'https://api.runflix.name.ng/api';

        let allMatches = [];
        let currentDateFilter = 'today';

        // ===== FETCH MATCHES =====
        async function fetchMatches() {
            const container = document.getElementById('matchesContainer');

            try {
                // Try football streaming endpoint first (has actual stream URLs)
                let response = await fetch(`${API_BASE}/football/streaming?apikey=${API_KEY}`);
                let data;

                if (response.ok) {
                    data = await response.json();
                    console.log('Football Streaming API Response:', data);
                } else {
                    // Fallback to sports/all endpoint
                    response = await fetch(`${API_BASE}/sports/all?category=football&apikey=${API_KEY}`);
                    if (!response.ok) throw new Error('Failed to fetch matches');
                    data = await response.json();
                    console.log('Sports All API Response:', data);
                }

                let matches = [];

                // Parse different response formats
                if (data.result && data.result.matches) {
                    matches = data.result.matches;
                } else if (data.result && Array.isArray(data.result)) {
                    matches = data.result;
                } else if (data.matches) {
                    matches = data.matches;
                } else if (Array.isArray(data)) {
                    matches = data;
                }

                if (matches.length === 0) {
                    container.innerHTML = `
                        <div class="no-matches">
                            <i class="fas fa-futbol"></i>
                            <p>No matches available right now</p>
                            <p style="font-size:0.8rem;margin-top:0.5rem;opacity:0.5;">Check back later for live games</p>
                        </div>
                    `;
                    return;
                }

                allMatches = matches;
                updateCounts(matches);
                renderMatches(matches, currentDateFilter);

            } catch (error) {
                console.error('Error fetching matches:', error);
                container.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading matches. Please try again.</p>
                        <button onclick="fetchMatches()" style="margin-top:1rem;padding:0.4rem 1.5rem;border-radius:50px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:700;cursor:pointer;font-family:inherit;">
                            <i class="fas fa-sync"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        // ===== UPDATE COUNTS =====
        function updateCounts(matches) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            let todayCount = 0;
            let tomorrowCount = 0;
            let upcomingCount = 0;

            matches.forEach(m => {
                const matchDate = m.date || m.startTime || '';
                if (!matchDate) {
                    upcomingCount++;
                    return;
                }
                const d = new Date(matchDate);
                if (d >= today && d < tomorrow) {
                    todayCount++;
                } else if (d >= tomorrow && d < new Date(tomorrow.getTime() + 86400000)) {
                    tomorrowCount++;
                } else if (d >= tomorrow) {
                    upcomingCount++;
                }
            });

            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('tomorrowCount').textContent = tomorrowCount;
            document.getElementById('upcomingCount').textContent = upcomingCount;
        }

        // ===== IS LIVE MATCH =====
        function isLiveMatch(match) {
            const status = match.status || '';
            const liveStatuses = ['Live', '1H', '2H', 'HT', 'ET', 'P', 'In Progress', 'Half Time', 'Second Half', 'First Half'];
            return liveStatuses.some(s => status.includes(s));
        }

        // ===== FORMAT DATE =====
        function formatDate(dateString) {
            if (!dateString) return 'TBD';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateString;
            }
        }

        // ===== GET STREAM URL =====
        function getStreamUrl(match) {
            // Check if match has streams with actual URLs
            if (match.streams && match.streams.length > 0) {
                // Return the first stream URL
                return match.streams[0].url || match.streams[0].originalUrl || '';
            }

            // Check for sources with id
            if (match.sources && match.sources.length > 0) {
                // Try to construct URL from source
                const source = match.sources[0];
                // If source has a URL directly
                if (source.url) return source.url;
                // If source has id, try to construct
                if (source.id) {
                    // Try different URL patterns
                    const patterns = [
                        `https://streamed.pk/embed/${source.id}`,
                        `https://streamed.pk/watch/${source.id}`,
                        `https://play.sportsteam368.com/play/${source.id}`,
                        `https://www.fqzb162.com/broadcast/${source.id}`
                    ];
                    return patterns[0]; // Return first pattern
                }
            }

            // Fallback: Google search
            return `https://www.google.com/search?q=watch+${encodeURIComponent(match.homeTeam || match.home || '')}+vs+${encodeURIComponent(match.awayTeam || match.away || '')}+live+stream`;
        }

        // ===== GET ALL STREAMS =====
        function getAllStreams(match) {
            let streams = [];

            // From streams array
            if (match.streams && match.streams.length > 0) {
                match.streams.forEach((s, i) => {
                    streams.push({
                        title: s.title || `CH ${i + 1}`,
                        url: s.url || s.originalUrl || ''
                    });
                });
            }

            // From sources array
            if (match.sources && match.sources.length > 0) {
                match.sources.forEach((s, i) => {
                    const url = s.url || (s.id ? `https://streamed.pk/embed/${s.id}` : '');
                    if (url) {
                        streams.push({
                            title: s.source ? `${s.source.toUpperCase()}` : `CH ${streams.length + 1}`,
                            url: url
                        });
                    }
                });
            }

            // If no streams found, add a default one
            if (streams.length === 0) {
                streams.push({
                    title: 'CH 1',
                    url: getStreamUrl(match)
                });
            }

            return streams;
        }

        // ===== RENDER MATCHES =====
        function renderMatches(matches, dateFilter) {
            const container = document.getElementById('matchesContainer');

            let filtered = [...matches];

            // Apply date filter
            if (dateFilter === 'today') {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                filtered = filtered.filter(m => {
                    const d = new Date(m.date || m.startTime || '');
                    return d >= today && d < tomorrow;
                });
            } else if (dateFilter === 'tomorrow') {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const dayAfter = new Date(tomorrow);
                dayAfter.setDate(dayAfter.getDate() + 1);
                filtered = filtered.filter(m => {
                    const d = new Date(m.date || m.startTime || '');
                    return d >= tomorrow && d < dayAfter;
                });
            } else if (dateFilter === 'upcoming') {
                const tomorrow = new Date();
                tomorrow.setHours(0, 0, 0, 0);
                tomorrow.setDate(tomorrow.getDate() + 2);
                filtered = filtered.filter(m => {
                    const d = new Date(m.date || m.startTime || '');
                    return d >= tomorrow;
                });
            }

            // Sort: Live matches first
            filtered.sort((a, b) => {
                const aLive = isLiveMatch(a);
                const bLive = isLiveMatch(b);
                if (aLive && !bLive) return -1;
                if (!aLive && bLive) return 1;
                return 0;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-futbol"></i>
                        <p>No matches for ${dateFilter}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            filtered.forEach(match => {
                const homeTeam = match.homeTeam || match.home || match.teams?.home?.name || 'Home';
                const awayTeam = match.awayTeam || match.away || match.teams?.away?.name || 'Away';
                const homeLogo = match.homeLogo || match.homeBadge || match.teams?.home?.logo || '';
                const awayLogo = match.awayLogo || match.awayBadge || match.teams?.away?.logo || '';
                const league = match.league || match.leagueName || 'Football';
                const status = match.status || 'Scheduled';
                const date = match.date || match.startTime || match.startTime || '';

                const isLive = isLiveMatch(match);
                const isFinal = status === 'Full Time' || status === 'FT' || status === 'Finished';

                let statusClass = 'scheduled';
                let statusText = status || 'Scheduled';

                if (isLive) {
                    statusClass = 'live';
                    statusText = '🔴 LIVE';
                } else if (isFinal) {
                    statusClass = 'final';
                    statusText = '✅ Full Time';
                }

                const streams = getAllStreams(match);
                const hasStreams = streams.length > 0;

                const card = document.createElement('div');
                card.className = 'match-card';

                let channelsHTML = '';
                if (hasStreams) {
                    channelsHTML = `
                        <div class="stream-channels">
                            <span class="channel-label"><i class="fas fa-signal"></i> Streams:</span>
                            ${streams.slice(0, 12).map((s, i) => `
                                <button class="channel-btn" onclick="openStream('${s.url}', '${homeTeam} vs ${awayTeam} - ${s.title}')">
                                    <i class="fas fa-play"></i> ${s.title}
                                </button>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="match-top">
                        <div class="match-teams">
                            <div class="team">
                                <img class="team-logo" src="${homeLogo || 'https://via.placeholder.com/40/00ff88/ffffff?text=?'}" alt="${homeTeam}" onerror="this.src='https://via.placeholder.com/40/00ff88/ffffff?text=?'" />
                                <span class="team-name">${homeTeam}</span>
                            </div>
                            <span class="vs-badge">VS</span>
                            <div class="team">
                                <img class="team-logo" src="${awayLogo || 'https://via.placeholder.com/40/00ff88/ffffff?text=?'}" alt="${awayTeam}" onerror="this.src='https://via.placeholder.com/40/00ff88/ffffff?text=?'" />
                                <span class="team-name">${awayTeam}</span>
                            </div>
                        </div>
                        <div class="match-meta">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <span class="league-name">${league}</span>
                            <span class="match-time">
                                <i class="far fa-clock"></i> ${formatDate(date)}
                            </span>
                        </div>
                    </div>
                    ${channelsHTML}
                `;

                container.appendChild(card);
            });
        }

        // ===== OPEN STREAM =====
        function openStream(url, title) {
            if (!url) {
                showToast('No stream URL available', 'error');
                return;
            }

            // Open in new tab/window
            window.open(url, '_blank');
            showToast(`Opening ${title}...`, 'info');
        }

        // ===== SHOW TOAST =====
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconMap = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // ===== DATE TABS =====
        document.querySelectorAll('.date-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                currentDateFilter = tab.dataset.date;
                renderMatches(allMatches, currentDateFilter);
            });
        });

        // ===== INIT =====
        fetchMatches();

        // Refresh every 60 seconds
        setInterval(fetchMatches, 60000);

        console.log('%c⚽ DevSave Pro - World-Class Football Streaming', 'font-size:24px; font-weight:bold; color:#00ff88;');
        console.log('%c💻 Built with ❤️ by Dev Gift', 'font-size:14px; color:#a0a0c0;');
        console.log('%c🏆 Live Football from RunFlix API', 'font-size:12px; color:#00d4ff;');
    </script>
